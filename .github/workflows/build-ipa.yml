name: build-ipa
on: [push, workflow_dispatch]

jobs:
  # Chạy toàn bộ test vectors trước. Đỏ = chưa được ra xe.
  vectors:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vector tests (DashCore) and screen snapshots (DashRender)
        timeout-minutes: 8
        working-directory: DashCore
        run: swift test 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0
      - name: Snapshot sizes
        if: always()
        working-directory: DashCore
        run: |
          grep SNAPSHOT test.log || true
          echo "---- last test lines ----"
          grep -E "error|failed|Test Case .* started" test.log | tail -25 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: DashCore/snapshots

  app:
    needs: vectors
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project YaLink.xcodeproj -scheme YaLink -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/YaLink.app Payload/
          zip -qr YaLink.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: YaLink-ipa
          path: YaLink.ipa
