name: build-ipa
on: [push, workflow_dispatch]

jobs:
  # Chạy toàn bộ test vectors trước. Đỏ = chưa được ra xe.
  vectors:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vector tests (DashCore) and screen snapshots (DashRender)
        timeout-minutes: 8
        working-directory: DashCore
        run: swift test 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0
      - name: Snapshot sizes
        if: always()
        working-directory: DashCore
        run: |
          grep SNAPSHOT test.log || true
          echo "---- last test lines ----"
          grep -E "error|failed|Test Case .* started" test.log | tail -25 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: DashCore/snapshots

  # Chạy app thật trên trình giả lập iPhone và chụp từng mục của giao diện app (xem ở artifact "ui-screenshots")
  ui:
    needs: vectors
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project YaLink.xcodeproj -scheme YaLink -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Run on a simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          APP=$(find simbuild -name YaLink.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          for p in location-always photos media-library; do xcrun simctl privacy "$UDID" grant $p com.trongpm.yalink || true; done
          mkdir shots
          # Lần mở đầu tiên: màn "Chào bạn!" (chưa có tên)
          xcrun simctl launch --terminate-running-process "$UDID" com.trongpm.yalink
          sleep 6
          xcrun simctl io "$UDID" screenshot "shots/onboarding.png"
          # 4 tab: dash = Đồng hồ, nav = Dẫn đường, car = Xe (dữ liệu mẫu), set = Cài đặt
          for s in dash nav car set; do
            SIMCTL_CHILD_YALINK_SKIP_ONBOARD=1 SIMCTL_CHILD_YALINK_SEED=1 SIMCTL_CHILD_YALINK_TAB=$s SIMCTL_CHILD_YALINK_NAV=1 \
              xcrun simctl launch --terminate-running-process "$UDID" com.trongpm.yalink
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
          done
          # Bảng xác nhận điểm đến
          SIMCTL_CHILD_YALINK_SKIP_ONBOARD=1 SIMCTL_CHILD_YALINK_CONFIRM=1 SIMCTL_CHILD_YALINK_TAB=nav \
            xcrun simctl launch --terminate-running-process "$UDID" com.trongpm.yalink
          sleep 6
          xcrun simctl io "$UDID" screenshot "shots/confirm.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots

  app:
    needs: vectors
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project YaLink.xcodeproj -scheme YaLink -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/YaLink.app Payload/
          zip -qr YaLink.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: YaLink-ipa
          path: YaLink.ipa
